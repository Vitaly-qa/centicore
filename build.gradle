plugins {
    id 'java'
    id 'io.qameta.allure' version '2.11.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

group = 'ru.avtozp2015'
version = '1.0-SNAPSHOT'

allure {
    report {
        version.set("2.27.0")
    }
    adapter {
        aspectjWeaver.set(true)
        frameworks {
            junit5 {
                adapterVersion.set("2.27.0")
            }
        }
    }
}


repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'com.codeborne:selenide:6.19.1'
    testImplementation 'io.qameta.allure:allure-selenide:2.27.0'
    testImplementation 'org.slf4j:slf4j-simple:2.0.12'
}
tasks.withType(Test) {
    systemProperties(System.getProperties())
    useJUnitPlatform()

    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}



task smoke(type: Test) {
    useJUnitPlatform {
        includeTags("smoke")
    }
}

task positive(type: Test) {
    useJUnitPlatform {
        includeTags("positive")
    }
}

task contacts(type: Test) {
    useJUnitPlatform {
        includeTags("contacts")
    }
}

task vacancy(type: Test) {
    useJUnitPlatform {
        includeTags("vacancy")
    }
}

task integration(type: Test) {
    useJUnitPlatform {
        includeTags("integration")
    }
}

task technologies(type: Test) {
    useJUnitPlatform {
        includeTags("technologies")
    }
}

task language(type: Test) {
    useJUnitPlatform {
        includeTags("language")
    }
}

task call(type: Test) {
    useJUnitPlatform {
        includeTags("call")
    }
}

